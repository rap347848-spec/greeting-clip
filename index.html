<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقطع السلام 3D</title>
<style>
:root{--bg:#f4efe6;--ink:#2b2b2b;--card:#fff;--accent:#e4572e;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--ink:#f1f1f1;--card:#262b33;--accent:#ff7a59}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
#stage{position:relative;width:100%;max-width:800px;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#8ac}
canvas{width:100%;height:100%;display:block}
.bub{position:absolute;left:0;top:0;background:#fff;color:#222;font-weight:700;padding:.4em .9em;border-radius:16px;box-shadow:0 4px 12px #0003;white-space:nowrap;transform-origin:50% 100%;opacity:0;pointer-events:none;font-size:var(--fs,18px)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.h{position:absolute;left:0;top:0;color:#ff4d6d;opacity:0;pointer-events:none;font-size:calc(var(--fs,18px)*1.4)}
.bar{width:100%;max-width:800px;height:8px;background:var(--card);border-radius:4px;overflow:hidden}
#p{height:100%;width:0;background:var(--accent)}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 28px;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="bar"><div id="p"></div></div>
<button id="r">▶ ابدأ</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,D=10,$=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,k)=>a+(b-a)*k,ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const dark=matchMedia("(prefers-color-scheme: dark)").matches;
const P=dark?{s1:"#0b1a2e",s2:"#3a6a94",gr:0x2f6b34,pa:0x6b5d40,h1:0x2e5a3a,h2:0x25492f,fo:0x2f7a3a,hs:0x6a8cc0,hg:0x2a3a2a,hi:.6,sc:0xbcd0ff,si:.7,cl:0x8aa0b5,fg:0x3a6a94,sun:0xf4f1de}
:{s1:"#6dbdf0",s2:"#eaf7ff",gr:0x79c764,pa:0xeed9a6,h1:0xa8d79a,h2:0x86c177,fo:0x4fae4a,hs:0xdff2ff,hg:0x8aa77a,hi:.85,sc:0xfff1d0,si:1.1,cl:0xffffff,fg:0xd9f0ff,sun:0xffd54a};
const cv=document.createElement("canvas");cv.width=2;cv.height=256;
const cx=cv.getContext("2d"),gd=cx.createLinearGradient(0,0,0,256);gd.addColorStop(0,P.s1);gd.addColorStop(1,P.s2);cx.fillStyle=gd;cx.fillRect(0,0,2,256);
const scene=new T.Scene();scene.background=new T.CanvasTexture(cv);scene.fog=new T.Fog(P.fg,26,75);
const ren=new T.WebGLRenderer({canvas:$("c"),antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.outputEncoding=T.sRGBEncoding;
const cam=new T.PerspectiveCamera(38,4/3,.1,120);
scene.add(new T.HemisphereLight(P.hs,P.hg,P.hi));
const sun=new T.DirectionalLight(P.sc,P.si);sun.position.set(6,12,8);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:40});sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0005;scene.add(sun);
const M=(c,r=.7)=>new T.MeshStandardMaterial({color:c,roughness:r});
const put=(g,m,x,y,z,p=scene)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
const sph=(r,w=24)=>new T.SphereGeometry(r,w,16),cyl=(a,b,h)=>new T.CylinderGeometry(a,b,h,16);
// بيئة
const gr=put(new T.PlaneGeometry(140,100),M(P.gr,1),0,0,-25);gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;gr.castShadow=false;
const pa=put(new T.PlaneGeometry(60,2.8),M(P.pa,1),0,.01,0);pa.rotation.x=-Math.PI/2;pa.receiveShadow=true;pa.castShadow=false;
[[-14,-24,16,P.h1],[10,-26,20,P.h1],[-2,-19,11,P.h2],[19,-17,10,P.h2]].forEach(([x,z,r,c])=>{const h=put(sph(r,32),M(c,1),x,-r*.35,z);h.scale.y=.5;h.castShadow=false});
const trees=[];
[[-6.5,-4,1.1],[-10,-7,1.4],[6,-5,1.2],[9,-3.5,1],[3,-9,1.5],[-3.5,-10,1.3]].forEach(([x,z,s])=>{const g=new T.Group();g.position.set(x,0,z);g.scale.setScalar(s);
 put(cyl(.18,.26,1.6),M(0x7b4a24),0,.8,0,g);
 [[0,2.3,0,1],[.5,1.8,.2,.7],[-.5,1.9,-.1,.75]].forEach(([a,b,c,d])=>{const m=M(P.fo,.9);m.flatShading=true;put(new T.IcosahedronGeometry(d,1),m,a,b,c,g)});
 scene.add(g);trees.push(g)});
const fcol=[0xff6b9d,0xffd93d,0xffffff,0xc77dff],flowers=[];let sd=7;const rn=()=>(sd=(sd*9301+49297)%233280)/233280;
for(let i=0;i<26;i++){const g=new T.Group(),z=rn()<.7?2+rn()*3.5:-2-rn()*2;g.position.set(-9+rn()*18,0,z);
 put(cyl(.015,.015,.35),M(0x3d8b37),0,.175,0,g);const f=put(sph(.09),M(fcol[i%4],.6),0,.38,0,g);f.scale.y=.6;put(sph(.04),M(0xf9a826),0,.4,0,g);scene.add(g);flowers.push(g)}
const clouds=[];[[8.5,-14,0],[10,-18,16],[7.5,-12,32]].forEach(([y,z,b])=>{const g=new T.Group();g.position.set(b,y,z);g.userData.b=b;
 [[0,0,1.2],[-1.1,-.2,.9],[1.2,-.1,1],[.2,.5,.9]].forEach(([a,c,r])=>{const m=put(sph(r),M(P.cl,1),a,c,0,g);m.castShadow=false});scene.add(g);clouds.push(g)});
const sm=put(sph(1.7),new T.MeshBasicMaterial({color:P.sun,fog:false}),12,9,-22);sm.castShadow=false;
// شخصيات
function mk(o){
 const n=o.near,root=new T.Group(),body=new T.Group();root.add(body);
 const sk=M(o.skin,.55),part=(g,m,x,y,z,p)=>put(g,m,x,y,z,p||body);
 const legs=[];
 [-1,1].forEach(s=>{const l=new T.Group();l.position.set(s*.2,o.hip,0);body.add(l);
  part(cyl(o.lr,o.lr*.9,o.hip),M(o.leg),0,-o.hip/2,0,l);
  if(o.sock)part(cyl(o.lr*1.05,o.lr*1.05,.18),M(0xffffff),0,-o.hip+.2,0,l);
  part(sph(.2),M(o.shoe,.5),0,-o.hip+.03,.08,l).scale.set(1,.55,1.55);legs.push(l)});
 if(o.girl){part(sph(.4),M(o.top),0,1.55,0).scale.set(.95,1.05,.7);part(cyl(.32,.7,.75),M(o.top),0,1.05,0);part(new T.TorusGeometry(.7,.04,8,32),M(0xffd1e3),0,.69,0).rotation.x=Math.PI/2}
 else{part(sph(.5),M(o.top),0,1.5,0).scale.set(.95,1.05,.68);part(sph(.4),M(o.leg),0,1.0,0).scale.set(1.05,.7,.75)}
 part(cyl(.12,.14,.2),sk,0,1.95,0);
 const arms={};
 [-1,1].forEach(s=>{const a=new T.Group();a.position.set(s*o.sh,1.82,0);body.add(a);
  part(cyl(.115,.1,.5),M(o.top),0,-.25,0,a);part(sph(o.girl?.17:.12),M(o.top),0,0,0,a);
  const f=new T.Group();f.position.y=-.5;a.add(f);
  part(cyl(.095,.085,.45),sk,0,-.225,0,f);part(sph(.13),sk,0,-.5,0,f);part(sph(.1),sk,0,0,0,f);
  arms[s===n?"near":"far"]={a,f}});
 const head=new T.Group();head.position.y=2.45;body.add(head);
 part(sph(.55,32),sk,0,0,0,head).scale.set(1,.96,.96);
 const hm=M(o.hair,.6),cap=put(new T.SphereGeometry(.585,32,16,0,Math.PI*2,0,Math.PI*.56),hm,0,.02,0,head);cap.rotation.x=-.35;
 const pig=[];
 if(o.girl){part(sph(.6),hm,0,-.12,-.16,head).scale.set(1,1.15,.85);
  [-1,1].forEach(s=>{const g=new T.Group();g.position.set(s*.55,.1,-.12);head.add(g);part(sph(.2),hm,0,0,0,g);part(new T.ConeGeometry(.16,.55,12),hm,0,-.35,0,g).rotation.x=Math.PI;pig.push(g)});
  [-1,1].forEach(s=>part(new T.ConeGeometry(.13,.3,10),M(0xff6fa5),.15+s*.14,.56,.2,head).rotation.z=-s*Math.PI/2)}
 else part(sph(.2),hm,.05,.55,.15,head);
 const eyes=new T.Group();eyes.position.y=.04;head.add(eyes);
 [-1,1].forEach(s=>{part(sph(.12),M(0xffffff,.3),s*.2,0,.46,eyes).scale.z=.6;part(sph(.075),M(0x1b1b1b,.2),s*.2,0,.52,eyes).scale.z=.5;part(sph(.025),M(0xffffff,.1),s*.18,.03,.56,eyes);
  part(sph(.09),M(0xff8a9a,.9),s*.34,-.17,.38,head).scale.set(1,.7,.4)});
 const smile=part(new T.TorusGeometry(.11,.02,8,20,Math.PI),M(0x7a2b2b),0,-.16,.5,head);smile.rotation.z=Math.PI;
 const open=part(sph(.08),M(0x8a2c3a),0,-.22,.5,head);open.scale.set(1.3,.7,.35);open.visible=false;
 return{root,body,head,legs,arms,eyes,smile,open,pig,n}}
const boy=mk({skin:0xf3c9a1,top:0x3b82f6,leg:0x2f4b7c,hip:.95,lr:.17,shoe:0xf4f4f4,hair:0x2d1b10,near:-1,sh:.56});
const girl=mk({girl:1,skin:0xf6d0b0,top:0xe0508a,leg:0xf6d0b0,hip:.66,lr:.1,sock:1,shoe:0xc0392b,hair:0x5a3420,near:1,sh:.5});
scene.add(boy.root,girl.root);girl.root.scale.setScalar(.95);girl.root.position.x=1.5;girl.root.rotation.y=-1.2;boy.root.rotation.y=1.2;
// واجهة
const hz=[];for(let i=0;i<6;i++){const s=document.createElement("span");s.className="h";s.textContent="♥";$("stage").appendChild(s);hz.push(s)}
let sw=1,sh=1;
function rs(){sw=$("stage").clientWidth;sh=$("stage").clientHeight;ren.setSize(sw,sh,false);cam.aspect=sw/sh;cam.updateProjectionMatrix();$("stage").style.setProperty("--fs",Math.max(12,sw*.036)+"px")}
addEventListener("resize",rs);rs();
const V=new T.Vector3(),blink=t=>(t%3.4)<.13?.1:1;
function place(el,o,dy,s){o.getWorldPosition(V);V.y+=dy;V.project(cam);el.style.transform=`translate(${(V.x*.5+.5)*sw}px,${(-V.y*.5+.5)*sh}px) translate(-50%,-100%) scale(${Math.max(s,.001)})`;el.style.opacity=s>.02?1:0}
const pop=(t,a,b)=>ease(clamp((t-a)/.25,0,1))*(1-ease(clamp((t-b+.2)/.2,0,1)));
function act(c,t,k,s1,raise,talk,happy,off){
 const n=c.n,B=c.body;
 B.rotation.x=.08*k;
 c.legs[0].rotation.x=s1*.65*k;c.legs[1].rotation.x=-s1*.65*k;
 const fa=c.arms.far,na=c.arms.near;
 fa.a.rotation.set(-s1*.55*k,0,-n*.1);fa.f.rotation.x=-.1-.4*k;
 na.a.rotation.set(lerp(s1*.55*k,0,raise),0,lerp(n*.1,n*2.5,raise));
 na.f.rotation.set(-.1-.4*k*(1-raise),0,raise*(n*.35+Math.sin(t*14+off)*.55));
 c.head.rotation.z=raise*Math.sin(t*3+off)*.07+(happy?Math.sin(t*5)*.05:0);
 c.head.rotation.x=talk?Math.sin(t*9)*.03:0;
 c.eyes.scale.y=blink(t+off);
 const o=talk&&Math.sin(t*16+off)>0;c.open.visible=o;c.smile.visible=!o;c.smile.scale.setScalar(happy?1.4:1);
 c.pig.forEach((g,i)=>g.rotation.z=Math.sin(t*3+i)*.12);
}
let t0=0,on=false,said=[0,0],last=0;
function say(txt,pitch,rate,i){try{const u=new SpeechSynthesisUtterance(txt);u.lang="ar-SA";const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith("ar"));if(v.length)u.voice=v[i%v.length];u.pitch=pitch;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
$("r").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}t0=performance.now();on=true;said=[0,0];last=0;$("r").textContent="إعادة التشغيل"};
function frame(now){
 const raw=on?(now-t0)/1000:0,cyc=Math.floor(raw/D);if(cyc!==last){last=cyc;said=[0,0]}
 const el=raw%D,t=el,e=ease(t/D);
 cam.position.set(lerp(-3.2,-.6,e),lerp(2.6,2.2,e),lerp(13.5,9.3,e));cam.lookAt(lerp(-1.8,.3,e),1.7,0);cam.updateMatrixWorld();
 clouds.forEach((c,i)=>c.position.x=((c.userData.b+t*(.35+i*.2)+24)%48)-24);
 trees.forEach((g,i)=>g.rotation.z=Math.sin(t*1.4+i)*.02);
 flowers.forEach((f,i)=>f.rotation.z=Math.sin(t*2.4+i)*.12);
 // الشاب
 const wp=clamp(t/4,0,1),bx=-5.2+4.3*ease(wp),dd=wp<.5?4*wp:4*(1-wp),k=t<4?Math.min(1,dd*1.2):0,s1=Math.sin(bx*3.4);
 const rB=clamp((t-4.2)/.4,0,1)*(1-clamp((t-6.9)/.4,0,1)),hop=t>4.2&&t<4.6?Math.sin((t-4.2)/.4*Math.PI)*.3:0,happy=t>8.4;
 boy.root.position.set(bx,hop,0);boy.body.position.y=Math.abs(s1)*.07*k+Math.sin(t*2.2)*.012*(1-k);
 act(boy,t,k,s1,rB,t>4.4&&t<6.7,happy,0);
 // البنت
 const rG=clamp((t-6.2)/.4,0,1)*(1-clamp((t-8.8)/.4,0,1)),hopG=t>6.2&&t<6.6?Math.sin((t-6.2)/.4*Math.PI)*.25:0;
 girl.root.position.y=hopG;girl.body.position.y=Math.sin(t*2+1)*.012;
 act(girl,t,0,0,rG,t>6.5&&t<8.9,happy,1);
 // الفقاعات والقلوب
 if(on){if(t>4.4&&!said[0]){said[0]=1;say("مرحبا!",.7,.95,0)}if(t>6.5&&!said[1]){said[1]=1;say("أهلاً! كيف حالك؟",1.6,1,1)}}
 V.set((bx+1.5)/2,3.3,0);V.project(cam);
 hz.forEach((h,i)=>{const p=clamp((t-8.4)/1.6-i*.1,0,1);h.style.transform=`translate(${(V.x*.5+.5)*sw+(i-2.5)*sw*.04+Math.sin(p*6+i)*sw*.015}px,${(-V.y*.5+.5)*sh-p*sh*.3}px)`;h.style.opacity=p>0&&p<1?1-p*p:0});
 $("p").style.width=(el/D*100)+"%";
 ren.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
