<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقطع السلام – 10 ثواني</title>
<style>
:root{--bg:#f4efe6;--sky:#cfe8f5;--ground:#b9d79a;--ink:#2b2b2b;--card:#ffffff;--accent:#e4572e;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--sky:#1f3a52;--ground:#3b5a35;--ink:#f1f1f1;--card:#262b33;--accent:#ff7a59}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
svg{width:100%;max-width:760px;height:auto;border-radius:16px}
.bar{width:100%;max-width:760px;height:8px;background:var(--card);border-radius:4px;overflow:hidden}
#p{height:100%;width:0;background:var(--accent)}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 28px;cursor:pointer}
.b text{font-size:26px;fill:#222;text-anchor:middle}
</style>
</head>
<body>
<svg viewBox="0 0 800 450" id="s">
  <rect width="800" height="450" fill="var(--sky)"/>
  <circle cx="680" cy="70" r="36" fill="#ffd54a"/>
  <rect y="380" width="800" height="70" fill="var(--ground)"/>

  <!-- الشاب -->
  <g id="boy">
    <g id="bl1"><line x1="-10" y1="300" x2="-10" y2="380" stroke="#34495e" stroke-width="14" stroke-linecap="round"/></g>
    <g id="bl2"><line x1="10" y1="300" x2="10" y2="380" stroke="#34495e" stroke-width="14" stroke-linecap="round"/></g>
    <rect x="-26" y="220" width="52" height="86" rx="14" fill="#3b82f6"/>
    <g id="barmB"><line x1="-26" y1="236" x2="-26" y2="296" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/></g>
    <g id="barmF" transform="translate(26,236)"><line x1="0" y1="0" x2="0" y2="60" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/><circle cx="0" cy="62" r="8" fill="#f2c9a0"/></g>
    <circle cy="188" r="32" fill="#f2c9a0"/>
    <path d="M-32 182 Q-30 150 0 154 Q30 150 32 182 Q10 166 -32 182Z" fill="#2d2013"/>
    <circle cx="10" cy="188" r="4" fill="#222"/><circle cx="-10" cy="188" r="4" fill="#222"/>
    <path id="bsmile" d="M-9 202 Q0 210 9 202" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- البنت -->
  <g id="girl" transform="translate(580,0)">
    <line x1="-9" y1="320" x2="-9" y2="380" stroke="#f2c9a0" stroke-width="12" stroke-linecap="round"/>
    <line x1="9" y1="320" x2="9" y2="380" stroke="#f2c9a0" stroke-width="12" stroke-linecap="round"/>
    <path d="M-24 222 L24 222 L44 326 L-44 326Z" fill="#e0508a"/>
    <g id="garmB"><line x1="26" y1="236" x2="26" y2="296" stroke="#f2c9a0" stroke-width="11" stroke-linecap="round"/></g>
    <g id="garmF" transform="translate(-26,236)"><line x1="0" y1="0" x2="0" y2="60" stroke="#f2c9a0" stroke-width="11" stroke-linecap="round"/></g>
    <path d="M-36 190 Q-40 140 0 140 Q40 140 36 190 L38 250 L22 250 L24 180 L-24 180 L-22 250 L-38 250Z" fill="#4a2c1a"/>
    <circle cy="190" r="30" fill="#f2c9a0"/>
    <path d="M-30 184 Q0 150 30 184 Q0 168 -30 184Z" fill="#4a2c1a"/>
    <circle cx="10" cy="190" r="4" fill="#222"/><circle cx="-10" cy="190" r="4" fill="#222"/>
    <path d="M-9 203 Q0 212 9 203" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-18" cy="200" r="5" fill="#ff9aa8" opacity=".6"/><circle cx="18" cy="200" r="5" fill="#ff9aa8" opacity=".6"/>
  </g>

  <!-- فقاعات الكلام -->
  <g class="b" id="bubB" opacity="0"><rect x="150" y="60" width="200" height="56" rx="16" fill="#fff"/><text x="250" y="97">مرحبا! 👋</text></g>
  <g class="b" id="bubG" opacity="0"><rect x="450" y="60" width="260" height="56" rx="16" fill="#fff"/><text x="580" y="97">أهلاً! كيف حالك؟</text></g>
</svg>
<div class="bar"><div id="p"></div></div>
<button id="r">إعادة التشغيل</button>

<script>
const D=10000,$=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
let t0=performance.now();
$("r").onclick=()=>{t0=performance.now()};
function frame(now){
  let ms=(now-t0)%D, t=ms/1000;
  // المشي من 0 إلى 4 ثواني
  const w=ease(clamp(t/4,0,1)), x=90+w*290, walking=t<4;
  const bob=walking?Math.abs(Math.sin(t*9))*6:0, sw=walking?Math.sin(t*9)*22:0;
  $("boy").setAttribute("transform",`translate(${x},${-bob})`);
  $("bl1").setAttribute("transform",`rotate(${sw} -10 300)`);
  $("bl2").setAttribute("transform",`rotate(${-sw} 10 300)`);
  $("barmB").setAttribute("transform",`rotate(${walking?-sw:0} -26 236)`);
  // سلام الشاب من 4 إلى 7
  let ba=walking?sw*.6:8;
  if(t>=4&&t<7.2) ba=-150+Math.sin(t*14)*18;
  $("barmF").setAttribute("transform",`translate(26,236) rotate(${ba})`);
  // سلام البنت من 6 إلى 9
  let ga=-8;
  if(t>=6&&t<9) ga=150+Math.sin(t*14)*18;
  $("garmF").setAttribute("transform",`translate(-26,236) rotate(${ga})`);
  // الفقاعات
  const bx=x+(-0);
  $("bubB").setAttribute("transform",`translate(${x-250+0},0)`);
  $("bubB").setAttribute("opacity",t>4.3&&t<6.6?1:0);
  $("bubG").setAttribute("opacity",t>6.4&&t<9?1:0);
  $("p").style.width=(ms/D*100)+"%";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
